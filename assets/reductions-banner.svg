<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible Parallel Reductions</title>
  <desc id="desc">A technical banner showing multiple reduction trees and the trade-off between accuracy, reproducibility, and performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1360" cy="95" r="180" fill="#312e81" opacity="0.22"/>
  <circle cx="1480" cy="430" r="220" fill="#065f46" opacity="0.18"/>

  <g opacity="0.9" stroke="url(#accent)" stroke-width="4" fill="none" filter="url(#glow)">
    <path d="M1030 108 L1110 170 L1190 108"/>
    <path d="M1110 170 L1270 250 L1430 170"/>
    <path d="M1270 250 L1270 350"/>
  </g>

  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="3">
    <circle cx="1030" cy="108" r="22"/>
    <circle cx="1190" cy="108" r="22"/>
    <circle cx="1430" cy="170" r="22"/>
    <circle cx="1110" cy="170" r="24" fill="#ede9fe" stroke="#a78bfa"/>
    <circle cx="1270" cy="250" r="28" fill="#d1fae5" stroke="#34d399"/>
    <circle cx="1270" cy="350" r="34" fill="#f8fafc" stroke="#c4b5fd"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#f8fafc">
    <text x="90" y="130" font-size="58" font-weight="700">Reproducible Parallel Reductions</text>
    <text x="90" y="190" font-size="28" fill="#cbd5e1">Comparative research across floating-point summation algorithms</text>

    <rect x="90" y="245" width="255" height="64" rx="18" fill="#1e3a8a" opacity="0.82"/>
    <rect x="370" y="245" width="255" height="64" rx="18" fill="#5b21b6" opacity="0.82"/>
    <rect x="650" y="245" width="255" height="64" rx="18" fill="#047857" opacity="0.82"/>

    <text x="217" y="286" text-anchor="middle" font-size="24" font-weight="600">Accuracy</text>
    <text x="497" y="286" text-anchor="middle" font-size="24" font-weight="600">Reproducibility</text>
    <text x="777" y="286" text-anchor="middle" font-size="24" font-weight="600">Performance</text>

    <text x="90" y="390" font-size="23" fill="#cbd5e1">CPU first  •  OpenMP  •  CUDA later  •  high-precision reference  •  reproducible benchmarks</text>
    <text x="90" y="438" font-size="21" fill="#94a3b8">Naive · Pairwise · Kahan · Neumaier · Deterministic trees · Binned accumulators</text>
  </g>
</svg>