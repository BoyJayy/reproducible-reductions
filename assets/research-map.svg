<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Comparative reduction research map</title>
  <desc id="desc">Several floating-point reduction approaches are evaluated on datasets and compared by accuracy, reproducibility, and performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1500" height="820" rx="30" fill="url(#bg)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="750" y="70" text-anchor="middle" font-size="44" font-weight="700" fill="#0f172a">Comparative Research Workflow</text>
    <text x="750" y="112" text-anchor="middle" font-size="23" fill="#475569">Multiple reduction approaches, one reproducible evaluation framework</text>

    <g filter="url(#shadow)">
      <rect x="65" y="175" width="300" height="470" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="425" y="175" width="650" height="470" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="1135" y="175" width="300" height="470" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <text x="215" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Input workloads</text>
    <text x="750" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Reduction approaches</text>
    <text x="1285" y="225" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">Evaluation</text>

    <g font-size="21" fill="#334155">
      <rect x="95" y="270" width="240" height="52" rx="14" fill="#dbeafe"/>
      <text x="215" y="303" text-anchor="middle">Random values</text>
      <rect x="95" y="338" width="240" height="52" rx="14" fill="#e0e7ff"/>
      <text x="215" y="371" text-anchor="middle">Wide exponent range</text>
      <rect x="95" y="406" width="240" height="52" rx="14" fill="#ede9fe"/>
      <text x="215" y="439" text-anchor="middle">Strong cancellation</text>
      <rect x="95" y="474" width="240" height="52" rx="14" fill="#fae8ff"/>
      <text x="215" y="507" text-anchor="middle">Adversarial orderings</text>
      <rect x="95" y="542" width="240" height="52" rx="14" fill="#fce7f3"/>
      <text x="215" y="575" text-anchor="middle">Dot products & norms</text>
    </g>

    <g font-size="20" fill="#1e293b">
      <rect x="470" y="270" width="250" height="54" rx="14" fill="#dbeafe"/>
      <text x="595" y="304" text-anchor="middle">Naive summation</text>
      <rect x="780" y="270" width="250" height="54" rx="14" fill="#dcfce7"/>
      <text x="905" y="304" text-anchor="middle">Higher precision</text>

      <rect x="470" y="344" width="250" height="54" rx="14" fill="#e0e7ff"/>
      <text x="595" y="378" text-anchor="middle">Pairwise / tree</text>
      <rect x="780" y="344" width="250" height="54" rx="14" fill="#fef3c7"/>
      <text x="905" y="378" text-anchor="middle">Kahan</text>

      <rect x="470" y="418" width="250" height="54" rx="14" fill="#ede9fe"/>
      <text x="595" y="452" text-anchor="middle">Neumaier</text>
      <rect x="780" y="418" width="250" height="54" rx="14" fill="#fae8ff"/>
      <text x="905" y="452" text-anchor="middle">Fixed deterministic tree</text>

      <rect x="470" y="492" width="250" height="54" rx="14" fill="#fce7f3"/>
      <text x="595" y="526" text-anchor="middle">OpenMP variants</text>
      <rect x="780" y="492" width="250" height="54" rx="14" fill="#fee2e2"/>
      <text x="905" y="526" text-anchor="middle">CUDA variants</text>

      <rect x="625" y="566" width="250" height="54" rx="14" fill="#ccfbf1"/>
      <text x="750" y="600" text-anchor="middle">Binned / reproducible accumulators</text>
    </g>

    <g font-size="21" fill="#334155">
      <rect x="1165" y="270" width="240" height="60" rx="16" fill="#dbeafe"/>
      <text x="1285" y="307" text-anchor="middle">Numerical error</text>
      <rect x="1165" y="350" width="240" height="60" rx="16" fill="#ede9fe"/>
      <text x="1285" y="387" text-anchor="middle">Bitwise reproducibility</text>
      <rect x="1165" y="430" width="240" height="60" rx="16" fill="#dcfce7"/>
      <text x="1285" y="467" text-anchor="middle">Latency & throughput</text>
      <rect x="1165" y="510" width="240" height="60" rx="16" fill="#fef3c7"/>
      <text x="1285" y="547" text-anchor="middle">Memory bandwidth</text>
    </g>

    <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M365 410 H415"/>
      <path d="M1075 410 H1125"/>
    </g>

    <rect x="285" y="700" width="930" height="72" rx="20" fill="#0f172a"/>
    <text x="750" y="744" text-anchor="middle" font-size="24" font-weight="600" fill="#f8fafc">Goal: identify the Pareto frontier between accuracy, reproducibility, and performance</text>
  </g>
</svg>